[tool.poetry]
name = "meteortrace"
version = "0.1.0"
description = "Reproducible geometry and astrometry tools for meteors photographed with consumer cameras."
authors = ["Victor Barna"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/githubvctr/meteortrace"
packages = [{ include = "meteortrace", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
numpy = "^2.0"
astropy = "^7.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-cov = "^5.0"
black = "^24.8"
ruff = "^0.6"
pre-commit = "^3.8"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=meteortrace --cov-report=term-missing"

[tool.coverage.run]
source = ["src/meteortrace"]
